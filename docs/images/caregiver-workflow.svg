<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586878"/></marker></defs><rect x="1" y="1" width="1398" height="478" rx="18" fill="#ffffff" stroke="#C9D6DF" stroke-width="1.6"/><text x="40" y="46" font-size="24" font-weight="700" fill="#14283B" text-anchor="start">Caregiver workflow: from sign-up to monitoring</text><rect x="40" y="100" width="240" height="290" rx="14" fill="#FFFFFF" stroke="#1B7B8A" stroke-width="1.6"/><circle cx="72" cy="132" r="16" fill="#1B7B8A"/><text x="72" y="138" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="58" y="173" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Create your account</text><text x="58" y="199.1" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Register with your email.</text><text x="58" y="222.42" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Enter the patient’s first</text><text x="58" y="241.73999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">name.</text><text x="58" y="265.06" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Confirm you may see their</text><text x="58" y="284.38" font-size="14" font-weight="400" fill="#586878" text-anchor="start">data.</text><path d="M282 245 L308 245" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="310" y="100" width="240" height="290" rx="14" fill="#FFFFFF" stroke="#1B7B8A" stroke-width="1.6"/><circle cx="342" cy="132" r="16" fill="#1B7B8A"/><text x="342" y="138" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="328" y="173" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Set up the safe zone</text><text x="328" y="199.1" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Settings: home location</text><text x="328" y="218.42" font-size="14" font-weight="400" fill="#586878" text-anchor="start">and radius.</text><text x="328" y="241.73999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Generate a device key for</text><text x="328" y="261.06" font-size="14" font-weight="400" fill="#586878" text-anchor="start">the badge.</text><text x="328" y="284.38" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Add your phone number</text><text x="328" y="303.7" font-size="14" font-weight="400" fill="#586878" text-anchor="start">(optional).</text><path d="M552 245 L578 245" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="100" width="240" height="290" rx="14" fill="#FFFFFF" stroke="#6D5BE0" stroke-width="1.6"/><circle cx="612" cy="132" r="16" fill="#6D5BE0"/><text x="612" y="138" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="598" y="173" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Add family and</text><text x="598" y="195.1" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">friends</text><text x="598" y="221.2" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• People: name, relationship,</text><text x="598" y="240.51999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">note.</text><text x="598" y="263.84" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Upload 3 to 5 clear photos</text><text x="598" y="283.15999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start">each.</text><text x="598" y="306.47999999999996" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Each photo is checked for</text><text x="598" y="325.79999999999995" font-size="14" font-weight="400" fill="#586878" text-anchor="start">one clear face.</text><path d="M822 245 L848 245" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="850" y="100" width="240" height="290" rx="14" fill="#FFFFFF" stroke="#1E7B4F" stroke-width="1.6"/><circle cx="882" cy="132" r="16" fill="#1E7B4F"/><text x="882" y="138" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="868" y="173" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Connect the patient</text><text x="868" y="195.1" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">screen</text><text x="868" y="221.2" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Settings: press Show a</text><text x="868" y="240.51999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">code.</text><text x="868" y="263.84" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Type the 6-digit code on</text><text x="868" y="283.15999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start">the patient’s phone or</text><text x="868" y="302.47999999999996" font-size="14" font-weight="400" fill="#586878" text-anchor="start">tablet.</text><text x="868" y="325.79999999999995" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Choose what that screen</text><text x="868" y="345.11999999999995" font-size="14" font-weight="400" fill="#586878" text-anchor="start">shows.</text><path d="M1092 245 L1118 245" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="1120" y="100" width="240" height="290" rx="14" fill="#FFFFFF" stroke="#14283B" stroke-width="1.6"/><circle cx="1152" cy="132" r="16" fill="#14283B"/><text x="1152" y="138" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1138" y="173" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Monitor and respond</text><text x="1138" y="199.1" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Alerts, medicines, location</text><text x="1138" y="218.42" font-size="14" font-weight="400" fill="#586878" text-anchor="start">and analytics.</text><text x="1138" y="241.73999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• A pop-up appears when</text><text x="1138" y="261.06" font-size="14" font-weight="400" fill="#586878" text-anchor="start">something new happens.</text><text x="1138" y="284.38" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Acknowledge or resolve</text><text x="1138" y="303.7" font-size="14" font-weight="400" fill="#586878" text-anchor="start">each alert.</text><text x="40" y="440" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Try it any time: Location &gt; Demo controls simulates wandering and SOS. People &gt; Test recognition checks any photo.</text></svg>