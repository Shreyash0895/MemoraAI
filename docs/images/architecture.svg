<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586878"/></marker></defs><rect x="1" y="1" width="1238" height="778" rx="18" fill="#ffffff" stroke="#C9D6DF" stroke-width="1.6"/><text x="40" y="46" font-size="24" font-weight="700" fill="#14283B" text-anchor="start">MemoraAI architecture</text><rect x="40" y="90" width="360" height="185" rx="14" fill="#FBF1DC" stroke="#946200" stroke-width="1.6"/><text x="58" y="125" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">ESP32 badge (worn by the</text><text x="58" y="147.1" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">patient)</text><text x="58" y="173.2" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Camera, microphone, GPS, SOS button,</text><text x="58" y="192.51999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">speaker and a rechargeable battery.</text><text x="58" y="215.83999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start" font-style="italic">Firmware planned. The demo controls</text><text x="58" y="235.15999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start" font-style="italic">simulate the badge today.</text><rect x="440" y="90" width="360" height="185" rx="14" fill="#E5F4EC" stroke="#1E7B4F" stroke-width="1.6"/><text x="458" y="125" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Patient screen (phone or tablet)</text><text x="458" y="151.1" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Opens at /companion. No login: paired once</text><text x="458" y="170.42" font-size="14" font-weight="400" fill="#586878" text-anchor="start">with a 6-digit code.</text><text x="458" y="193.73999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Shows the date and time, medicines, who is</text><text x="458" y="213.05999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start">here, and a help button.</text><rect x="840" y="90" width="360" height="185" rx="14" fill="#E6F3F5" stroke="#1B7B8A" stroke-width="1.6"/><text x="858" y="125" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Caregiver dashboard (React)</text><text x="858" y="151.1" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Overview, Alerts, Medicines, People, Location,</text><text x="858" y="170.42" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Analytics and Settings.</text><text x="858" y="193.73999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Signs in with email and password.</text><rect x="20" y="300" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#C9D6DF" stroke-width="1.6" stroke-dasharray="8 6"/><text x="38" y="738" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Docker Compose: api container, face container and a volume for the database</text><rect x="40" y="340" width="1160" height="150" rx="14" fill="#EFEDFD" stroke="#6D5BE0" stroke-width="1.6"/><text x="60" y="372" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">API server (Node.js + Express)</text><rect x="60.0" y="392" width="214.4" height="72" rx="10" fill="#FFFFFF" stroke="#6D5BE0" stroke-width="1.2"/><text x="72.0" y="420" font-size="14" font-weight="700" fill="#14283B" text-anchor="start">Sign-in and sessions</text><rect x="286.4" y="392" width="214.4" height="72" rx="10" fill="#FFFFFF" stroke="#6D5BE0" stroke-width="1.2"/><text x="298.4" y="420" font-size="14" font-weight="700" fill="#14283B" text-anchor="start">Safe zone, alerts and</text><text x="298.4" y="439" font-size="14" font-weight="700" fill="#14283B" text-anchor="start">monitoring</text><rect x="512.8" y="392" width="214.4" height="72" rx="10" fill="#FFFFFF" stroke="#6D5BE0" stroke-width="1.2"/><text x="524.8" y="420" font-size="14" font-weight="700" fill="#14283B" text-anchor="start">Badge (device) API</text><rect x="739.2" y="392" width="214.4" height="72" rx="10" fill="#FFFFFF" stroke="#6D5BE0" stroke-width="1.2"/><text x="751.2" y="420" font-size="14" font-weight="700" fill="#14283B" text-anchor="start">People and photos</text><rect x="965.6" y="392" width="214.4" height="72" rx="10" fill="#FFFFFF" stroke="#6D5BE0" stroke-width="1.2"/><text x="977.6" y="420" font-size="14" font-weight="700" fill="#14283B" text-anchor="start">Patient screen pairing</text><rect x="140" y="570" width="360" height="150" rx="14" fill="#F1F5F8" stroke="#14283B" stroke-width="1.6"/><text x="158" y="605" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">SQLite database</text><text x="158" y="631.1" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Accounts, medicines, alerts, location history,</text><text x="158" y="649.04" font-size="13" font-weight="400" fill="#586878" text-anchor="start">people and photos, and recognitions. Kept in a</text><text x="158" y="666.98" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Docker volume, so data survives restarts.</text><rect x="740" y="570" width="360" height="150" rx="14" fill="#E5F4EC" stroke="#1E7B4F" stroke-width="1.6"/><text x="758" y="605" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Face service (Python + OpenCV)</text><text x="758" y="631.1" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Finds the face and turns it into 128 numbers</text><text x="758" y="649.04" font-size="13" font-weight="400" fill="#586878" text-anchor="start">(YuNet and SFace models). It stores nothing.</text><path d="M220 275 L220 340" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="234" y="296" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Location, battery, SOS and camera frames, sent</text><text x="234" y="313" font-size="13" font-weight="400" fill="#586878" text-anchor="start">with the device key</text><path d="M620 275 L620 340" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="634" y="296" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Pairing code, today view and help button</text><path d="M1020 275 L1020 340" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="1034" y="296" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Session sign-in.</text><text x="1034" y="313" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Refreshes every 4</text><text x="1034" y="330" font-size="13" font-weight="400" fill="#586878" text-anchor="start">seconds</text><path d="M320 490 L320 570" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="334" y="536" font-size="13" font-weight="400" fill="#586878" text-anchor="start">reads and writes everything</text><path d="M920 490 L920 570" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="934" y="524" font-size="13" font-weight="400" fill="#586878" text-anchor="start">photo or frame in,</text><text x="934" y="542" font-size="13" font-weight="400" fill="#586878" text-anchor="start">face fingerprint out</text></svg>