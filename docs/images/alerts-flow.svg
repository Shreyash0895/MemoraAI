<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="810" viewBox="0 0 1320 810" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586878"/></marker></defs><rect x="1" y="1" width="1318" height="808" rx="18" fill="#ffffff" stroke="#C9D6DF" stroke-width="1.6"/><text x="40" y="46" font-size="24" font-weight="700" fill="#14283B" text-anchor="start">What the server watches, and how you hear about it</text><text x="40" y="92" font-size="14" font-weight="700" fill="#586878" text-anchor="start">What happens</text><text x="440" y="92" font-size="14" font-weight="700" fill="#586878" text-anchor="start">Rule the server applies</text><text x="1060" y="92" font-size="14" font-weight="700" fill="#586878" text-anchor="start">Where you see it</text><rect x="40" y="110" width="350" height="112" rx="14" fill="#F1F5F8" stroke="#14283B" stroke-width="1.6"/><text x="58" y="143" font-size="15" font-weight="700" fill="#14283B" text-anchor="start">The badge sends a GPS position</text><rect x="440" y="110" width="560" height="112" rx="14" fill="#EFEDFD" stroke="#6D5BE0" stroke-width="1.6"/><text x="458" y="140.6" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Safe zone: one alert when the patient goes beyond the radius. They only</text><text x="458" y="159.92" font-size="14" font-weight="400" fill="#586878" text-anchor="start">count as back inside a little before the edge, so GPS jitter doesn’t repeat</text><text x="458" y="179.23999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">alerts.</text><path d="M392 166 L438 166" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><path d="M1002 166 L1048 166" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="238" width="350" height="112" rx="14" fill="#F1F5F8" stroke="#14283B" stroke-width="1.6"/><text x="58" y="271" font-size="15" font-weight="700" fill="#14283B" text-anchor="start">The badge reports its battery</text><rect x="440" y="238" width="560" height="112" rx="14" fill="#EFEDFD" stroke="#6D5BE0" stroke-width="1.6"/><text x="458" y="268.6" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Low battery: one alert at 20% or below. Armed again once the battery</text><text x="458" y="287.92" font-size="14" font-weight="400" fill="#586878" text-anchor="start">recovers to 30%.</text><path d="M392 294 L438 294" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><path d="M1002 294 L1048 294" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="366" width="350" height="112" rx="14" fill="#F1F5F8" stroke="#14283B" stroke-width="1.6"/><text x="58" y="399" font-size="15" font-weight="700" fill="#14283B" text-anchor="start">Help is pressed on the badge or the</text><text x="58" y="418.5" font-size="15" font-weight="700" fill="#14283B" text-anchor="start">patient screen</text><rect x="440" y="366" width="560" height="112" rx="14" fill="#EFEDFD" stroke="#6D5BE0" stroke-width="1.6"/><text x="458" y="396.6" font-size="14" font-weight="400" fill="#586878" text-anchor="start">SOS: a critical alert. Repeated presses within a minute are merged into</text><text x="458" y="415.92" font-size="14" font-weight="400" fill="#586878" text-anchor="start">one.</text><path d="M392 422 L438 422" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><path d="M1002 422 L1048 422" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="494" width="350" height="112" rx="14" fill="#F1F5F8" stroke="#14283B" stroke-width="1.6"/><text x="58" y="527" font-size="15" font-weight="700" fill="#14283B" text-anchor="start">Time passes (checked every minute)</text><rect x="440" y="494" width="560" height="112" rx="14" fill="#EFEDFD" stroke="#6D5BE0" stroke-width="1.6"/><text x="458" y="524.6" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Missed medicine: one alert per dose per day, 30 minutes after its time in</text><text x="458" y="543.9200000000001" font-size="14" font-weight="400" fill="#586878" text-anchor="start">the patient’s time zone, if it isn’t marked taken. Doses added after their</text><text x="458" y="563.2400000000001" font-size="14" font-weight="400" fill="#586878" text-anchor="start">time today are skipped.</text><path d="M392 550 L438 550" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><path d="M1002 550 L1048 550" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="622" width="350" height="112" rx="14" fill="#F1F5F8" stroke="#14283B" stroke-width="1.6"/><text x="58" y="655" font-size="15" font-weight="700" fill="#14283B" text-anchor="start">The badge camera sees a face</text><rect x="440" y="622" width="560" height="112" rx="14" fill="#EFEDFD" stroke="#6D5BE0" stroke-width="1.6"/><text x="458" y="652.6" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Unknown face: an alert at most every 5 minutes. A recognized person is</text><text x="458" y="671.9200000000001" font-size="14" font-weight="400" fill="#586878" text-anchor="start">only logged, not alerted.</text><path d="M392 678 L438 678" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><path d="M1002 678 L1048 678" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="1050" y="110" width="230" height="624" rx="14" fill="#E6F3F5" stroke="#1B7B8A" stroke-width="1.6"/><text x="1068" y="145" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Caregiver</text><text x="1068" y="167.1" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">dashboard</text><text x="1068" y="193.2" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Alerts list with severity,</text><text x="1068" y="212.51999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">acknowledge and resolve</text><text x="1068" y="235.83999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• A pop-up on any page</text><text x="1068" y="255.15999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start">within 4 seconds</text><text x="1068" y="278.47999999999996" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Activity timeline</text><text x="1068" y="301.79999999999995" font-size="14" font-weight="400" fill="#586878" text-anchor="start">• Overview cards and</text><text x="1068" y="321.11999999999995" font-size="14" font-weight="400" fill="#586878" text-anchor="start">analytics</text><text x="40" y="780" font-size="14" font-weight="700" fill="#946200" text-anchor="start">Not built yet: push, SMS or email notifications. Until then, alerts only show while the dashboard is open.</text></svg>