<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="705" viewBox="0 0 1320 705" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586878"/></marker></defs><rect x="1" y="1" width="1318" height="703" rx="18" fill="#ffffff" stroke="#C9D6DF" stroke-width="1.6"/><text x="40" y="46" font-size="24" font-weight="700" fill="#14283B" text-anchor="start">How the badge recognizes a face</text><rect x="40" y="80" width="275" height="205" rx="14" fill="#E6F3F5" stroke="#1B7B8A" stroke-width="1.6"/><circle cx="72" cy="112" r="16" fill="#1B7B8A"/><text x="72" y="118" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="58" y="153" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Badge camera</text><text x="58" y="179.1" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Takes a picture and sends it as a</text><text x="58" y="198.42" font-size="14" font-weight="400" fill="#586878" text-anchor="start">JPEG, with its device key.</text><path d="M317 182 L358 182" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="80" width="275" height="205" rx="14" fill="#EFEDFD" stroke="#6D5BE0" stroke-width="1.6"/><circle cx="392" cy="112" r="16" fill="#6D5BE0"/><text x="392" y="118" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="378" y="153" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">API receives the frame</text><text x="378" y="179.1" font-size="14" font-weight="400" fill="#586878" text-anchor="start">POST /api/device/recognize.</text><text x="378" y="198.42" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Checks the key and the image</text><text x="378" y="217.73999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">type.</text><path d="M637 182 L678 182" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="80" width="275" height="205" rx="14" fill="#E5F4EC" stroke="#1E7B4F" stroke-width="1.6"/><circle cx="712" cy="112" r="16" fill="#1E7B4F"/><text x="712" y="118" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="698" y="153" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Face service</text><text x="698" y="179.1" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Finds the largest face and turns it</text><text x="698" y="198.42" font-size="14" font-weight="400" fill="#586878" text-anchor="start">into 128 numbers (a fingerprint).</text><path d="M957 182 L998 182" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="1000" y="80" width="275" height="205" rx="14" fill="#EFEDFD" stroke="#6D5BE0" stroke-width="1.6"/><circle cx="1032" cy="112" r="16" fill="#6D5BE0"/><text x="1032" y="118" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1018" y="153" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">API compares and</text><text x="1018" y="175.1" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">decides</text><text x="1018" y="201.2" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Scores the face against every</text><text x="1018" y="220.51999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">saved photo of family and</text><text x="1018" y="239.83999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start">friends.</text><path d="M1137 287 L1137 337 L230 337" fill="none" stroke="#586878" stroke-width="2"/><path d="M230 337 L230 387" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="389" width="380" height="215" rx="14" fill="#E5F4EC" stroke="#1E7B4F" stroke-width="1.6"/><text x="58" y="426" font-size="19" font-weight="700" fill="#14283B" text-anchor="start">Match</text><text x="58" y="454.7" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Score 0.45 or higher, and clearly ahead of the</text><text x="58" y="474.02" font-size="14" font-weight="400" fill="#586878" text-anchor="start">next person.</text><text x="58" y="497.34" font-size="14" font-weight="400" fill="#14283B" text-anchor="start">“This is your son, Arjun. Visits every Sunday.”</text><text x="58" y="520.66" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Logged in the timeline (at most once per 10</text><text x="58" y="539.98" font-size="14" font-weight="400" fill="#586878" text-anchor="start">minutes) and shown on the patient screen.</text><path d="M660 337 L660 387" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="470" y="389" width="380" height="215" rx="14" fill="#FBF1DC" stroke="#946200" stroke-width="1.6"/><text x="488" y="426" font-size="19" font-weight="700" fill="#14283B" text-anchor="start">Unsure</text><text x="488" y="454.7" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Two people look about equally likely (within</text><text x="488" y="474.02" font-size="14" font-weight="400" fill="#586878" text-anchor="start">0.05).</text><text x="488" y="497.34" font-size="14" font-weight="400" fill="#14283B" text-anchor="start">“I’m not sure who this is.”</text><text x="488" y="520.66" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Logged, but no alert. The badge never guesses</text><text x="488" y="539.98" font-size="14" font-weight="400" fill="#586878" text-anchor="start">a name.</text><path d="M1090 337 L1090 387" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="900" y="389" width="380" height="215" rx="14" fill="#FBE9E7" stroke="#B3261E" stroke-width="1.6"/><text x="918" y="426" font-size="19" font-weight="700" fill="#14283B" text-anchor="start">Unknown</text><text x="918" y="454.7" font-size="14" font-weight="400" fill="#586878" text-anchor="start">The best score is below 0.45.</text><text x="918" y="478.02" font-size="14" font-weight="400" fill="#14283B" text-anchor="start">“I’m not sure who this is.”</text><text x="918" y="501.34" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Alert for the caregiver (at most one every 5</text><text x="918" y="520.66" font-size="14" font-weight="400" fill="#586878" text-anchor="start">minutes).</text><text x="40" y="642" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Adding a photo uses the same check: it must contain exactly one clear face, at least 60 pixels wide, or it is refused with a clear message.</text><text x="40" y="668" font-size="14" font-weight="400" fill="#586878" text-anchor="start">If the face service is down, the photo is saved and checked automatically once it is back. A wrong name is worse than no name, so matching is strict.</text></svg>