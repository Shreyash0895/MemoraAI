<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="690" viewBox="0 0 1320 690" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586878"/></marker></defs><rect x="1" y="1" width="1318" height="688" rx="18" fill="#ffffff" stroke="#C9D6DF" stroke-width="1.6"/><text x="40" y="46" font-size="24" font-weight="700" fill="#14283B" text-anchor="start">How calming assistance works</text><rect x="40" y="90" width="340" height="135" rx="14" fill="#F1F5F8" stroke="#14283B" stroke-width="1.6"/><text x="58" y="124" font-size="16" font-weight="700" fill="#14283B" text-anchor="start">The patient presses “I feel</text><text x="58" y="144.8" font-size="16" font-weight="700" fill="#14283B" text-anchor="start">worried”</text><text x="58" y="169.60000000000002" font-size="13" font-weight="400" fill="#586878" text-anchor="start">A calm, always-available button on the patient</text><text x="58" y="187.54000000000002" font-size="13" font-weight="400" fill="#586878" text-anchor="start">screen.</text><path d="M382 157 L468 157" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="240" width="340" height="135" rx="14" fill="#F1F5F8" stroke="#14283B" stroke-width="1.6"/><text x="58" y="274" font-size="16" font-weight="700" fill="#14283B" text-anchor="start">The caregiver offers an exercise</text><text x="58" y="298.8" font-size="13" font-weight="400" fill="#586878" text-anchor="start">From the dashboard, even from far away. The</text><text x="58" y="316.74" font-size="13" font-weight="400" fill="#586878" text-anchor="start">patient can say no.</text><path d="M382 307 L468 307" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="390" width="340" height="135" rx="14" fill="#F1F5F8" stroke="#14283B" stroke-width="1.6"/><text x="58" y="424" font-size="16" font-weight="700" fill="#14283B" text-anchor="start">The badge asks for comfort</text><text x="58" y="448.8" font-size="13" font-weight="400" fill="#586878" text-anchor="start">POST /api/device/distress, from a button or a</text><text x="58" y="466.74" font-size="13" font-weight="400" fill="#586878" text-anchor="start">phrase like “I’m scared” (firmware planned).</text><path d="M382 457 L468 457" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="470" y="90" width="330" height="435" rx="14" fill="#E6F3F5" stroke="#1B7B8A" stroke-width="1.6"/><text x="488" y="125" font-size="17" font-weight="700" fill="#14283B" text-anchor="start">Calming exercise</text><text x="488" y="151.1" font-size="14" font-weight="400" fill="#586878" text-anchor="start">1. “You are safe.” Shown and read aloud,</text><text x="488" y="170.42" font-size="14" font-weight="400" fill="#586878" text-anchor="start">never “calm down”.</text><text x="488" y="193.73999999999998" font-size="14" font-weight="400" fill="#586878" text-anchor="start">2. Breathe in for 4 seconds and out for 6,</text><text x="488" y="213.05999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start">five times, with a slowly growing circle.</text><text x="488" y="236.37999999999997" font-size="14" font-weight="400" fill="#586878" text-anchor="start">3. “How do you feel now?” with three big</text><text x="488" y="255.69999999999996" font-size="14" font-weight="400" fill="#586878" text-anchor="start">buttons.</text><text x="488" y="279.02" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Every word is fixed, reviewed wording. It</text><text x="488" y="298.34" font-size="14" font-weight="400" fill="#586878" text-anchor="start">is not a chatbot.</text><path d="M802 157 L888 157" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="890" y="90" width="390" height="135" rx="14" fill="#E5F4EC" stroke="#1E7B4F" stroke-width="1.6"/><text x="908" y="124" font-size="16" font-weight="700" fill="#14283B" text-anchor="start">Calmer</text><text x="908" y="148.8" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Logged in the timeline. Done.</text><path d="M802 307 L888 307" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="890" y="240" width="390" height="135" rx="14" fill="#FBF1DC" stroke="#946200" stroke-width="1.6"/><text x="908" y="274" font-size="16" font-weight="700" fill="#14283B" text-anchor="start">About the same</text><text x="908" y="298.8" font-size="13" font-weight="400" fill="#586878" text-anchor="start">Offered: breathe again, people who care about you,</text><text x="908" y="316.74" font-size="13" font-weight="400" fill="#586878" text-anchor="start">and gentle seated stretches if the caregiver turned</text><text x="908" y="334.68" font-size="13" font-weight="400" fill="#586878" text-anchor="start">them on.</text><path d="M802 457 L888 457" fill="none" stroke="#586878" stroke-width="2" marker-end="url(#a)"/><rect x="890" y="390" width="390" height="135" rx="14" fill="#FBE9E7" stroke="#B3261E" stroke-width="1.6"/><text x="908" y="424" font-size="16" font-weight="700" fill="#14283B" text-anchor="start">Still worried</text><text x="908" y="448.8" font-size="13" font-weight="400" fill="#586878" text-anchor="start">High-priority alert to the caregiver and a call button.</text><text x="908" y="466.74" font-size="13" font-weight="400" fill="#586878" text-anchor="start">The same choices stay available.</text><text x="40" y="575" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Three requests within 30 minutes also alert the caregiver. Alerts are limited so they don’t flood.</text><text x="40" y="601" font-size="14" font-weight="400" fill="#586878" text-anchor="start">Seated stretches are off unless the caregiver turns them on, and the patient can stop at any time.</text><text x="40" y="627" font-size="14" font-weight="700" fill="#946200" text-anchor="start">Distress is not detected automatically. It starts from the patient, a caregiver offer, or a badge call.</text></svg>